name: Build Treemap EXE (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # чтобы запускать вручную из Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: pyinstaller --onefile --noconsole treemap_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: treemap-exe-windows
          path: dist/treemap_gui.exe
          retention-days: 7
